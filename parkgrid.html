<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ParkGrid — Smart Parking Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  /* Core palette — cool slate / control-room with cyan accent (distinct from any restaurant identity) */
  --ink:#0b1220; --surface:#111b2e; --surface-raised:#16233a; --surface-hover:#1c2c47;
  --border:#25344f; --paper:#eaf1fb; --paper-dim:#a9b8d1; --muted:#7387a8;
  --cyan:#22c3e6; --cyan-bright:#5fdcf5; --cyan-dim:rgba(34,195,230,.14);

  /* Slot / booking status colors */
  --available:#2fd67e; --available-bg:rgba(47,214,126,.14);
  --reserved:#f2b23c; --reserved-bg:rgba(242,178,60,.14);
  --occupied:#f2495c; --occupied-bg:rgba(242,73,92,.14);
  --outofservice:#6c7891; --outofservice-bg:rgba(108,120,145,.16);
  --active:#4a8fe0; --active-bg:rgba(74,143,224,.14);
  --completed:#6c7891; --completed-bg:rgba(108,120,145,.16);
  --cancelled:#f2495c; --cancelled-bg:rgba(242,73,92,.14);

  --font-display:'Sora',-apple-system,sans-serif; --font-body:'Manrope',-apple-system,sans-serif; --font-mono:'JetBrains Mono',monospace;
  --radius:12px; --radius-sm:7px; --shadow:0 10px 28px rgba(0,0,0,.45); --sidebar-w:230px;
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-body);font-size:15px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--font-mono)}
button{font-family:var(--font-body);cursor:pointer}
input,select,textarea{font-family:var(--font-body)}
::selection{background:var(--cyan);color:var(--ink)}
:focus-visible{outline:2px solid var(--cyan-bright);outline-offset:2px}
.hidden{display:none !important}

/* ---- Login ---- */
.login-wrap{min-height:100vh;display:flex}
@media (max-width:760px){.login-wrap{flex-direction:column}}
.login-left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;background:radial-gradient(circle at 25% 15%, rgba(34,195,230,.10), transparent 55%), var(--surface);border-right:1px solid var(--border)}
@media (max-width:760px){.login-left{border-right:none;border-bottom:1px solid var(--border);padding:32px 24px}}
.brand-hero{max-width:400px;text-align:center}
.hero-emblem{width:108px;height:108px;margin-bottom:20px}
.hero-title{font-family:var(--font-display);font-size:32px;font-weight:800;letter-spacing:-.01em}
.hero-sub{color:var(--paper-dim);font-size:14.5px;margin-top:12px;line-height:1.55}
.hero-pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.hero-pill{font-size:12px;padding:6px 12px;border-radius:999px;background:var(--surface-raised);border:1px solid var(--border);color:var(--paper-dim)}
.login-right{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
.login-form{width:340px;padding:32px}
.field-label{display:block;font-size:12.5px;font-weight:600;color:var(--paper-dim);margin-top:14px;margin-bottom:6px}
.text-input{width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-raised);color:var(--paper);font-size:16px}
@media (min-width:600px){.text-input{font-size:14px}}
.login-error{margin-top:14px;font-size:13px;color:var(--occupied);background:var(--occupied-bg);padding:8px 12px;border-radius:var(--radius-sm)}
.login-hint{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.role-toggle{display:flex;gap:6px;margin-bottom:16px;background:var(--surface-raised);padding:4px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.role-toggle button{flex:1;padding:8px;border:none;background:none;border-radius:5px;color:var(--paper-dim);font-size:12.5px;font-weight:600}
.role-toggle button.active{background:var(--cyan);color:var(--ink)}

/* ---- App shell ---- */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.sidebar-brand-row{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:20px}
.brand-mark{width:36px;height:36px;flex-shrink:0}
.sidebar-brand{font-family:var(--font-display);font-size:17px;font-weight:800;line-height:1.15}
.sidebar-eyebrow{font-family:var(--font-mono);font-size:9.5px;color:var(--cyan);letter-spacing:.08em;margin-top:2px}
.nav-group-label{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.08em;padding:14px 12px 6px}
.nav-group-label:first-of-type{padding-top:0}
.nav-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--paper-dim);text-decoration:none;font-size:13.5px;font-weight:600;transition:background .15s,color .15s;border:none;background:none;text-align:left;width:100%}
.nav-link:hover{background:var(--surface-hover);color:var(--paper)}
.nav-link.active{background:var(--cyan-dim);color:var(--cyan-bright)}
.sidebar-footer{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-hover);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--cyan-bright);flex-shrink:0}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{min-height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;flex-wrap:wrap;gap:8px}
.topbar-user{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--paper-dim)}
.role-chip{font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:999px;background:var(--surface-raised);color:var(--cyan-bright);letter-spacing:.05em;border:1px solid var(--border)}
.logout-btn{background:none;border:1px solid var(--border);color:var(--paper-dim);padding:6px 12px;border-radius:var(--radius-sm);font-size:13px}
.logout-btn:hover{border-color:var(--cyan);color:var(--cyan-bright)}
.page{flex:1;overflow-y:auto;padding:22px}
@media (max-width:860px){
  .sidebar{width:64px;padding:16px 8px}
  .sidebar-brand,.sidebar-eyebrow,.nav-link span.label,.sidebar-footer{display:none}
  .nav-link{justify-content:center}
}

/* ---- Shared components ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);border:1px solid transparent;font-size:13.5px;font-weight:700;transition:filter .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--cyan);color:var(--ink)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-primary:disabled{background:var(--surface-raised);color:var(--muted);cursor:not-allowed}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--paper-dim)}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan-bright)}
.btn-danger{background:transparent;border-color:var(--occupied);color:var(--occupied)}
.btn-danger:hover{background:var(--occupied-bg)}
.btn-sm{padding:5px 10px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;font-family:var(--font-mono);letter-spacing:.02em;text-transform:uppercase}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.empty-state{text-align:center;padding:56px 20px;color:var(--muted)}
.empty-state h3{color:var(--paper-dim);margin-bottom:6px}
.toast-stack{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:1000;max-width:calc(100vw - 32px)}
.toast{background:var(--surface-raised);border:1px solid var(--border);border-left:3px solid var(--cyan);padding:12px 18px;border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:13.5px;max-width:360px;animation:slide-in .2s ease-out}
.toast.error{border-left-color:var(--occupied)}
.toast.warn{border-left-color:var(--reserved)}
@keyframes slide-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:var(--muted);font-size:13px}
.modal-overlay{position:fixed;inset:0;background:rgba(4,8,16,.65);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px}
.modal-card{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:420px;width:100%;box-shadow:var(--shadow);max-height:88vh;overflow-y:auto}
.modal-actions{display:flex;gap:10px;flex-direction:column}
.modal-actions .btn{width:100%}
select,input[type=text],input[type=number],input[type=password],input[type=tel],textarea{padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-raised);color:var(--paper);font-size:13.5px}
label.small{font-size:12px;color:var(--paper-dim)}
.dropdown{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);min-width:170px;z-index:20;overflow:hidden}
.dropdown button{display:block;width:100%;text-align:left;padding:9px 12px;background:none;border:none;color:var(--paper-dim);font-size:13px}
.dropdown button:hover{background:var(--surface-hover)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat-card-v2{display:flex;align-items:center;gap:12px}
.stat-icon{width:38px;height:38px;border-radius:10px;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:3px}
.stat-value{font-size:22px;font-weight:700}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:980px){.two-col{grid-template-columns:1fr}}
.slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.slot-tile{border-radius:var(--radius-sm);padding:12px;border:1px solid var(--border);position:relative;background:var(--surface)}
.icon-btn-sm{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--occupied);display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;font-size:11px;line-height:1}
.qr-box{background:#fff;padding:10px;border-radius:8px;display:inline-block}
.receipt-paper{background:var(--paper);color:#12181f;padding:22px 20px;border-radius:6px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6}
.receipt-divider{border-top:1px dashed #8b93a3;margin:10px 0}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* =========================================================
   ParkGrid — standalone client-only Smart Parking Management System
   No backend. All data lives in localStorage.
   ========================================================= */

const STORAGE_KEY = "parkgrid_state_v1";

const VEHICLE_TYPES = {
  CAR: { label: "Car", icon: "🚗", rate: 30, dailyRate: 240 },
  BIKE: { label: "Bike", icon: "🏍️", rate: 15, dailyRate: 120 },
  EV: { label: "EV", icon: "⚡", rate: 40, dailyRate: 320 },
  VIP: { label: "VIP", icon: "⭐", rate: 80, dailyRate: 640 },
};
const FLOORS = ["Basement", "Ground Floor", "Floor 1", "Floor 2"];
const SLOT_COUNTS_PER_FLOOR_TYPE = { CAR: 6, BIKE: 4, EV: 2, VIP: 2 };
const SUBSCRIBER_SLOT_TYPES = ["CAR", "BIKE"]; // types that get a dedicated subscriber-only slot per floor

function buildSlots() {
  const slots = [];
  let id = 1;
  FLOORS.forEach((floor, fi) => {
    Object.keys(VEHICLE_TYPES).forEach((vt) => {
      const count = SLOT_COUNTS_PER_FLOOR_TYPE[vt];
      for (let i = 1; i <= count; i++) {
        const floorCode = floor === "Basement" ? "B" : floor === "Ground Floor" ? "G" : "F" + floor.slice(-1);
        // Reserve the last slot of each Car/Bike group on every floor exclusively
        // for vehicles with an active subscription — so they always have a spot.
        const isSubscriberSlot = SUBSCRIBER_SLOT_TYPES.includes(vt) && i === count;
        slots.push({
          id: id++,
          code: `${floorCode}-${vt[0]}${vt === "EV" ? "V" : ""}-${String(i).padStart(3, "0")}${isSubscriberSlot ? "-S" : ""}`,
          floor,
          vehicleType: vt,
          status: "AVAILABLE",
          reservationCode: null,
          subscriberOnly: isSubscriberSlot,
        });
      }
    });
  });
  return slots;
}

function seedState() {
  return {
    // No pre-seeded accounts anymore — Customer/Staff/Manager profiles are created
    // automatically the first time someone signs in (see handleLoginSubmit).
    users: [],
    slots: buildSlots(),
    bookings: [],
    payments: [],
    subscriptions: [],
    notifications: [],
    seq: { booking: 100001, payment: 1, subscription: 1, notification: 1 },
    stateVersion: 1,
  };
}

let state = loadState();
let session = {
  user: null,
  page: "dashboard",
  reserve: { floor: "", vehicleType: "CAR", slotId: null },
  search: "",
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const loaded = JSON.parse(raw);
      const fresh = seedState();
      const merged = Object.assign({}, fresh, loaded);
      // Registered Customer/Staff/Manager profiles are created at sign-in time now
      // (no fixed credential list), so keep whatever was actually saved.
      merged.users = loaded.users || fresh.users;
      merged.seq = Object.assign({}, fresh.seq, merged.seq);
      reconcileSlotStatuses(merged);
      return merged;
    }
  } catch (e) {}
  return seedState();
}
// Self-healing cleanup: earlier versions of this app had a bug where a slot could get
// stuck showing RESERVED/OCCUPIED with nothing actually behind it anymore (e.g. a
// booking that was since cancelled/completed elsewhere, or a stale write from before
// the double-booking fixes existed). Anything that isn't backed by a real live
// booking or an active paid subscription covering today gets freed back up.
function reconcileSlotStatuses(st) {
  let changed = false;
  const now = new Date();
  st.slots.forEach((slot) => {
    if (slot.status !== "RESERVED" && slot.status !== "OCCUPIED") return;
    const liveBooking = st.bookings.find((b) => b.slotId === slot.id && ["RESERVED", "ACTIVE", "PENDING_PAYMENT"].includes(b.status));
    if (liveBooking) return;
    const liveSub = st.subscriptions.find((s) => s.slotId === slot.id && s.status === "ACTIVE" && new Date(s.startDate) <= now && new Date(s.endDate) >= now);
    if (liveSub) return;
    slot.status = "AVAILABLE";
    changed = true;
  });
  return changed;
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function nextSeq(kind) {
  const n = state.seq[kind]++;
  saveState();
  return n;
}
function genBookingId() {
  return "SPM-" + String(nextSeq("booking"));
}

/* ---------- Toasts ---------- */
let toasts = [];
function showToast(message, type) {
  const id = Date.now() + Math.random();
  toasts.push({ id, message, type: type || "info" });
  renderToasts();
  setTimeout(() => {
    toasts = toasts.filter((t) => t.id !== id);
    renderToasts();
  }, 4200);
}
function renderToasts() {
  let stack = document.getElementById("toast-stack");
  if (!stack) {
    stack = document.createElement("div");
    stack.id = "toast-stack";
    stack.className = "toast-stack";
    document.body.appendChild(stack);
  }
  stack.innerHTML = toasts.map((t) => `<div class="toast ${t.type}">${escapeHtml(t.message)}</div>`).join("");
}

/* ---------- Modal ---------- */
function showModal({ title, bodyHtml, actions }) {
  let host = document.getElementById("modal-root");
  if (!host) {
    host = document.createElement("div");
    host.id = "modal-root";
    document.body.appendChild(host);
  }
  host.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-card">
        <h3 style="margin-bottom:12px">${escapeHtml(title)}</h3>
        ${bodyHtml || ""}
        <div class="modal-actions" style="margin-top:16px">
          ${actions.map((a, i) => `<button class="btn ${a.primary ? "btn-primary" : "btn-ghost"}" data-modal-action="${i}">${escapeHtml(a.label)}</button>`).join("")}
        </div>
      </div>
    </div>`;
  host.querySelectorAll("[data-modal-action]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.getAttribute("data-modal-action"));
      const action = actions[idx];
      // Run the handler FIRST while its inputs are still in the DOM, then close
      // (unless it wants to stay open, e.g. to show a validation error).
      action.onClick?.();
      if (!action.keepOpen) closeModal();
    });
  });
}
function closeModal() {
  const host = document.getElementById("modal-root");
  if (host) host.innerHTML = "";
}

/* ---------- Utilities ---------- */
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = String(str == null ? "" : str);
  return div.innerHTML;
}
function money(n) {
  return Number(n || 0).toFixed(2);
}
function findSlot(id) {
  return state.slots.find((s) => s.id === Number(id));
}
function findBooking(id) {
  return state.bookings.find((b) => b.id === Number(id));
}
function findBookingByBookingId(bookingId) {
  return state.bookings.find((b) => b.bookingId === bookingId);
}
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}
function minutesBetween(a, b) {
  return Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
}
function calcCharge(vehicleType, minutes) {
  const rate = VEHICLE_TYPES[vehicleType].rate;
  const hours = Math.max(1, Math.ceil(minutes / 60));
  return hours * rate;
}
function activeSubscriptionFor(vehicleNumber) {
  const now = new Date();
  return state.subscriptions.find(
    (s) =>
      s.status === "ACTIVE" &&
      s.vehicleNumber.toUpperCase() === (vehicleNumber || "").toUpperCase() &&
      new Date(s.startDate) <= now &&
      new Date(s.endDate) >= now
  );
}
function dateRangesOverlap(startA, endA, startB, endB) {
  return new Date(startA) <= new Date(endB) && new Date(startB) <= new Date(endA);
}
function slotBookedForRange(slotId, startDate, endDate, excludeSubId) {
  return state.subscriptions.find(
    (s) =>
      s.slotId === Number(slotId) &&
      s.status !== "CANCELLED" &&
      s.id !== excludeSubId &&
      dateRangesOverlap(s.startDate, s.endDate, startDate, endDate)
  );
}
// slotBookedForRange only ever checked OTHER SUBSCRIPTIONS — it never checked live
// walk-in bookings. That gap let a subscription get approved/paid and silently
// overwrite a slot that a walk-in customer was actively, physically parked in right
// now, leaving two live claims (the walk-in booking AND the subscription) on the
// same slot at once. This checks the other direction.
function findLiveBookingOnSlot(slotId) {
  return state.bookings.find((b) => b.slotId === Number(slotId) && ["RESERVED", "ACTIVE", "PENDING_PAYMENT"].includes(b.status));
}
// When a walk-in booking frees a slot, hand it back to a paid subscriber whose
// coverage window includes today if one's waiting — otherwise it just goes AVAILABLE.
function releaseSlot(slot) {
  if (!slot) return;
  const now = new Date();
  const activeSub = state.subscriptions.find((s) => s.slotId === slot.id && s.status === "ACTIVE" && new Date(s.startDate) <= now && new Date(s.endDate) >= now);
  slot.status = activeSub ? "RESERVED" : "AVAILABLE";
}
function daysBetweenInclusive(startDate, endDate) {
  const start = new Date(startDate);
  start.setHours(0, 0, 0, 0);
  const end = new Date(endDate);
  end.setHours(0, 0, 0, 0);
  return Math.round((end - start) / 86400000) + 1;
}
function logNotification(type, to, message) {
  state.notifications.unshift({ id: nextSeq("notification"), type, to, message, at: new Date().toISOString() });
  if (state.notifications.length > 200) state.notifications.length = 200;
}
function todayBounds() {
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  const end = new Date();
  end.setHours(23, 59, 59, 999);
  return { start, end };
}

/* ---------- Root render ---------- */
const root = document.getElementById("root");
function render() {
  if (!session.user) renderLogin();
  else renderApp();
}
function navigate(page) {
  session.page = page;
  render();
}
function logout() {
  session.user = null;
  render();
}

/* ---------- Login ---------- */
let loginRoleHint = "ADMIN";
const STAFF_CODE = "BKC001";
const MANAGER_CODE = "BKM001";
const ROLE_LABELS = { ADMIN: "Manager", STAFF: "Staff", CUSTOMER: "Customer" };
let loginRole = "CUSTOMER";

function renderLogin() {
  root.innerHTML = `
    <div class="login-wrap">
      <div class="login-left">
        <div class="brand-hero">
          <svg class="hero-emblem" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="70" cy="70" r="66" stroke="var(--cyan)" stroke-width="1" opacity="0.4"/>
            <rect x="20" y="20" width="100" height="100" rx="16" stroke="var(--cyan)" stroke-width="1.5"/>

function handleLoginSubmit(e) {
  e.preventDefault();
  const errorEl = document.getElementById("login-error");
  const name = document.getElementById("lf-name").value.trim();

  if (!name) {
    errorEl.innerHTML = `<div class="login-error">Please fill in every field</div>`;
    return;
  }

  let vehicleNumber = null;
  let phone = null;
  let existingUser = null;

  if (loginRole === "CUSTOMER") {
    phone = document.getElementById("lf-phone").value.trim();
    if (!phone) {
      errorEl.innerHTML = `<div class="login-error">Please fill in every field</div>`;
      return;
    }
    if (!/^[0-9]{10}$/.test(phone)) {
      errorEl.innerHTML = `<div class="login-error">Enter a valid 10-digit phone number</div>`;
      return;
    }
    existingUser = state.users.find((u) => u.mobile === phone && u.role === loginRole);
    vehicleNumber = document.getElementById("lf-vehicle").value.trim();
    if (!vehicleNumber) {
      errorEl.innerHTML = `<div class="login-error">Enter your vehicle number</div>`;
      return;
    }
  } else {
    // Staff/Manager log in with just their name and the shared role code each time —
    // no phone number is collected or stored for these roles.
    const code = document.getElementById("lf-code").value.trim();
    const expected = loginRole === "STAFF" ? STAFF_CODE : MANAGER_CODE;
    if (code !== expected) {
      errorEl.innerHTML = `<div class="login-error">Incorrect ${loginRole === "STAFF" ? "staff" : "manager"} code</div>`;
      return;
    }
    existingUser = state.users.find((u) => u.fullName.toLowerCase() === name.toLowerCase() && u.role === loginRole);
  }

  let user = existingUser;
  if (user) {
    user.fullName = name; // keep name up to date
  } else {
    user = { username: `${loginRole}-${phone || name.replace(/\s+/g, "").toLowerCase()}-${Date.now()}`, fullName: name, role: loginRole, mobile: phone };
    state.users.push(user);
  }
  if (vehicleNumber) user.lastVehicleNumber = vehicleNumber;
  saveState();

  session.user = user;
  session.page = "dashboard";
  if (vehicleNumber) session.reserve.lastVehicleNumber = vehicleNumber;
  render();
}

function findSlotHold(slotId) {
  // Whatever is currently claiming this slot's RESERVED (or OCCUPIED) status — a
  // regular booking or a date-range subscription — and whether it's actually paid.
  const booking = state.bookings.find((b) => b.slotId === slotId && ["RESERVED", "ACTIVE", "PENDING_PAYMENT"].includes(b.status));
  if (booking) {
    return { type: "booking", record: booking, paid: booking.paymentStatus === "PAID" || booking.paymentStatus === "SUBSCRIPTION", amountDue: booking.charges || 0 };
  }
  const now = new Date();
  const sub = state.subscriptions.find(
    (s) => s.slotId === slotId && ["PENDING_APPROVAL", "PENDING_PAYMENT", "ACTIVE"].includes(s.status) && new Date(s.startDate) <= now && new Date(s.endDate) >= now
  );
  if (sub) {
    return { type: "subscription", record: sub, paid: sub.status === "ACTIVE", amountDue: sub.price || 0 };
  }
  return null;
}

function renderSlotsGrid() {
  const host = document.getElementById("slots-grid-host");
  if (!host) return;
  if (reconcileSlotStatuses(state)) saveState();
  const canManage = session.user.role === "ADMIN" || session.user.role === "STAFF";
  let slots = state.slots;
  if (slotFilter.floor) slots = slots.filter((s) => s.floor === slotFilter.floor);
  if (slotFilter.vehicleType) slots = slots.filter((s) => s.vehicleType === slotFilter.vehicleType);

  const byFloor = {};
  slots.forEach((s) => { (byFloor[s.floor] = byFloor[s.floor] || []).push(s); });

  host.innerHTML = Object.keys(byFloor).length === 0
    ? `<div class="empty-state card"><h3>No slots match</h3></div>`
    : Object.entries(byFloor)
        .map(
          ([floor, floorSlots]) => `
      <div style="margin-bottom:22px">
        <div class="mono" style="font-size:11px;color:var(--cyan);letter-spacing:.06em;margin-bottom:10px">${floor.toUpperCase()}</div>
        <div class="slots-grid">
          ${floorSlots
            .map((s) => {
              const v = SLOT_STATUS_VAR[s.status];
              const vt = VEHICLE_TYPES[s.vehicleType];
              const hold = s.status === "RESERVED" ? findSlotHold(s.id) : null;
              const overdue = hold && hold.type === "booking" ? reservationOverdueInfo(hold.record) : { isWarning: false };
              return `
            <div class="slot-tile" style="border-color:${overdue.isWarning ? "var(--occupied)" : `var(--${v})`};${overdue.isWarning ? "background:var(--occupied-bg)" : ""}">
              <div style="display:flex;justify-content:space-between;align-items:start">
                <span class="mono" style="font-weight:700;font-size:13px">${s.code}</span>
                <span style="font-size:15px">${overdue.isWarning ? "⚠" : vt.icon}</span>
              </div>
              ${s.subscriberOnly ? `<div style="font-size:10px;color:var(--cyan-bright);margin-top:3px">🔒 Subscriber slot</div>` : ""}
              <span class="badge" style="color:var(--${overdue.isWarning ? "occupied" : v});background:var(--${overdue.isWarning ? "occupied" : v}-bg);margin-top:8px">${overdue.isWarning ? "NO-SHOW RISK" : s.status.replace("_", " ")}</span>
              ${canManage ? `<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" data-manage-slot="${s.id}">Manage</button>` : ""}
            </div>`;
            })
            .join("")}
        </div>
      </div>`
        )
        .join("");

  host.querySelectorAll("[data-manage-slot]").forEach((btn) =>
    btn.addEventListener("click", () => {
      const slot = findSlot(btn.getAttribute("data-manage-slot"));
      const hold = slot.status === "RESERVED" || slot.status === "OCCUPIED" ? findSlotHold(slot.id) : null;
      const unpaidWarning =
        hold && !hold.paid
          ? `<div class="login-error" style="margin-top:10px">⚠ This slot is linked to ${hold.type === "booking" ? `booking <strong>${hold.record.bookingId}</strong>` : `a slot reservation for <strong>${hold.record.vehicleNumber}</strong>`}, and payment is <strong>not completed</strong> (₹${hold.amountDue} due). Freeing or disabling this slot will NOT cancel that charge — check with billing first.</div>`
          : "";
      showModal({
        title: `Manage ${slot.code}`,
        bodyHtml: `<p style="color:var(--paper-dim);font-size:13px;margin:0 0 4px">Current status: <strong style="color:var(--paper)">${slot.status.replace("_", " ")}</strong></p>
          <p style="color:var(--muted);font-size:12px">Changing status here overrides any active booking link for this slot — use with care.</p>${unpaidWarning}`,
        actions: [
          { label: "Mark Available", primary: true, onClick: () => setSlotStatus(slot, "AVAILABLE", hold) },
          { label: "Mark Out of Service / Maintenance", onClick: () => setSlotStatus(slot, "OUT_OF_SERVICE", hold) },
          { label: "Cancel" },
        ],
      });
    })
  );
}

function setSlotStatus(slot, status, hold) {
  if (hold && !hold.paid) {
    const ok = confirm(`Payment for this slot's reservation is NOT completed yet (₹${hold.amountDue} due). Are you sure you want to change slot ${slot.code} to ${status.replace("_", " ")} anyway?`);
    if (!ok) return;
  }
  slot.status = status;
  saveState();
  showToast(`${slot.code} → ${status.replace("_", " ")}`);
  if (session.page === "slots") renderSlotsGrid();
}

function slotHasSubscriptionNow(slotId) {
  // slot.status only gets physically flipped to RESERVED when a subscription's date
  // range happens to cover "today" at the moment it's approved — that's not a
  // reliable enough signal on its own. A walk-in booking must also be checked
  // directly against any subscription (pending or active) that covers right now,
  // or a slot can end up double-committed to both a subscriber and a walk-in.
  return !!slotBookedForRange(slotId, new Date().toISOString(), new Date().toISOString());
}

function renderReserveSlotsGrid() {
  const host = document.getElementById("rs-slots-grid");
  if (!host) return;

  const r = session.reserve;
  const typedVehicle = document.getElementById("rs-vehicle-number")?.value.trim() || session.user.lastVehicleNumber || "";
  const isSubscriber = typedVehicle ? !!activeSubscriptionFor(typedVehicle) : false;

  let slots = state.slots.filter((s) => s.vehicleType === r.vehicleType);
  if (r.floor) slots = slots.filter((s) => s.floor === r.floor);

  host.innerHTML = slots
    .map((s) => {
      const v = SLOT_STATUS_VAR[s.status];
      const subHold = s.status === "AVAILABLE" && slotHasSubscriptionNow(s.id);
      const locked = s.subscriberOnly && !isSubscriber;
      const selectable = s.status === "AVAILABLE" && !locked && !subHold;
      const isSelected = r.slotId === s.id;
      return `
      <div class="slot-tile" style="border-color:${isSelected ? "var(--cyan)" : s.subscriberOnly ? "var(--cyan)" : `var(--${v})`};${selectable ? "cursor:pointer" : "opacity:.6"};${s.subscriberOnly ? "background-image:linear-gradient(160deg, rgba(34,195,230,.08), transparent 60%)" : ""}" ${selectable ? `data-pick-slot="${s.id}"` : ""}>
